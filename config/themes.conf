# shellcheck shell=bash
# ==============================================================================
# ThunarLE / Thunar-xfce — Configuration Multi-Thèmes (config/theme.confs)
# Thèmes disponibles : overwatch | cyberpunk | obsidian | nord-frost
# ==============================================================================

# Thème actif par défaut (peut être surchargé par THUNAR_THEME dans l'env)
ACTIVE_THEME="${THUNAR_THEME:-overwatch}"

# Cibles de synchronisation visuelle
THEME_SYNC_TUI=true
THEME_SYNC_GUI=true
THEME_SYNC_HUD=true
THEME_SYNC_NOTIFICATIONS=true

# Typographie par défaut (GUI / Rofi / Wofi / HUD)
THEME_FONT_FAMILY="JetBrains Mono"
THEME_FONT_SIZE="10"
THEME_BORDER_RADIUS="8"

# ── Résolution dynamique des palettes ─────────────────────────────────────────
thunar_apply_theme() {
    local requested="${1:-${ACTIVE_THEME}}"

    # Couleurs sémantiques communes
    export THEME_HEX_WARN="#F59E0B"
    export THEME_HEX_DANGER="#EF4444"
    export THEME_ANSI_WARN=$'\033[1;33m'
    export THEME_ANSI_DANGER=$'\033[1;31m'
    export THEME_ANSI_MUTED=$'\033[0;90m'
    export THEME_ANSI_BOLD=$'\033[1m'
    export THEME_ANSI_RESET=$'\033[0m'

    case "$requested" in
        overwatch)
            export ACTIVE_THEME="overwatch"
            export THEME_LABEL="🟩 Tactique Émeraude (Overwatch)"
            # Palette HEX (GUI / HUD / Pango)
            export THEME_HEX_BG="#020617"
            export THEME_HEX_SURFACE="#0F172A"
            export THEME_HEX_PRIMARY="#10B981"
            export THEME_HEX_SECONDARY="#34D399"
            export THEME_HEX_ACCENT="#06B6D4"
            export THEME_HEX_TEXT="#ECFDF5"
            # Palette ANSI (TUI Ghost Recon)
            export THEME_ANSI_PRIMARY=$'\033[38;5;42m'
            export THEME_ANSI_SECONDARY=$'\033[38;5;79m'
            export THEME_ANSI_ACCENT=$'\033[38;5;45m'
            # Icônes HUD
            export THEME_HUD_ICON_ON="🟩"
            export THEME_HUD_ICON_WARN="🟠"
            export THEME_HUD_ICON_OFF="⬛"
            ;;

        cyberpunk)
            export ACTIVE_THEME="cyberpunk"
            export THEME_LABEL="🌸 Neon Night City (Cyberpunk)"
            export THEME_HEX_BG="#090014"
            export THEME_HEX_SURFACE="#1A0B2E"
            export THEME_HEX_PRIMARY="#EC4899"
            export THEME_HEX_SECONDARY="#06B6D4"
            export THEME_HEX_ACCENT="#F43F5E"
            export THEME_HEX_TEXT="#FDF2F8"
            export THEME_ANSI_PRIMARY=$'\033[38;5;205m'
            export THEME_ANSI_SECONDARY=$'\033[38;5;51m'
            export THEME_ANSI_ACCENT=$'\033[38;5;197m'
            export THEME_HUD_ICON_ON="🟪"
            export THEME_HUD_ICON_WARN="⚡"
            export THEME_HUD_ICON_OFF="⬛"
            ;;

        obsidian)
            export ACTIVE_THEME="obsidian"
            export THEME_LABEL="🖤 Stealth Black-Ops (Obsidian)"
            export THEME_HEX_BG="#000000"
            export THEME_HEX_SURFACE="#111827"
            export THEME_HEX_PRIMARY="#475569"
            export THEME_HEX_SECONDARY="#F59E0B"
            export THEME_HEX_ACCENT="#94A3B8"
            export THEME_HEX_TEXT="#F8FAFC"
            export THEME_ANSI_PRIMARY=$'\033[38;5;245m'
            export THEME_ANSI_SECONDARY=$'\033[38;5;214m'
            export THEME_ANSI_ACCENT=$'\033[38;5;250m'
            export THEME_HUD_ICON_ON="🛡️"
            export THEME_HUD_ICON_WARN="🟡"
            export THEME_HUD_ICON_OFF="⚫"
            ;;

        nord-frost)
            export ACTIVE_THEME="nord-frost"
            export THEME_LABEL="❄️ Arctic Command (Nord Frost)"
            export THEME_HEX_BG="#2E3440"
            export THEME_HEX_SURFACE="#3B4252"
            export THEME_HEX_PRIMARY="#88C0D0"
            export THEME_HEX_SECONDARY="#81A1C1"
            export THEME_HEX_ACCENT="#A3BE8C"
            export THEME_HEX_TEXT="#ECEFF4"
            export THEME_ANSI_PRIMARY=$'\033[38;5;110m'
            export THEME_ANSI_SECONDARY=$'\033[38;5;111m'
            export THEME_ANSI_ACCENT=$'\033[38;5;108m'
            export THEME_HUD_ICON_ON="❄️"
            export THEME_HUD_ICON_WARN="🟠"
            export THEME_HUD_ICON_OFF="⬜"
            ;;

        *)
            echo "⚠️ [theme.confs] Thème inconnu '$requested', repli sur 'overwatch'." >&2
            thunar_apply_theme "overwatch"
            return 0
            ;;
    esac

    # Chaîne CSS inline réutilisable pour Wofi / Rofi / HUD Pango
    export THEME_HUD_PANGO_FG="${THEME_HEX_PRIMARY}"
    export THEME_ROFI_THEME_STR="window { background-color: ${THEME_HEX_BG}; border: 2px; border-color: ${THEME_HEX_PRIMARY}; border-radius: ${THEME_BORDER_RADIUS}px; } element selected { background-color: ${THEME_HEX_PRIMARY}; text-color: ${THEME_HEX_BG}; } element-text { text-color: ${THEME_HEX_TEXT}; font: \"${THEME_FONT_FAMILY} ${THEME_FONT_SIZE}\"; }"
}

# Applique automatiquement le thème actif dès le chargement du fichier
thunar_apply_theme "$ACTIVE_THEME"
